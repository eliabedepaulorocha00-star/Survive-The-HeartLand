name: Build APK (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-android:
    name: Exportar APK de debug
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar templates de exportação do Godot
        run: |
          set -e
          echo "HOME=$HOME  GODOT_VERSION=${GODOT_VERSION:-?}"
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates ]; then
            cp -r /root/.local/share/godot/export_templates/. ~/.local/share/godot/export_templates/
          fi
          ls -la ~/.local/share/godot/export_templates/

      - name: Configurar Godot para exportar Android
        run: |
          set -e
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          echo "Android SDK em: $ANDROID_SDK"
          JAVAC="$(readlink -f "$(which javac)")"
          JAVA_PATH="$(dirname "$(dirname "$JAVAC")")"
          echo "Java em: $JAVA_PATH"
          # Godot 4.3 pede build-tools 34 (o container só traz a 33)
          yes | sdkmanager --sdk_root="$ANDROID_SDK" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK" "build-tools;34.0.0" || true
          ls "$ANDROID_SDK/build-tools" || true
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore /root/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          ls -la /root/debug.keystore
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres

      - name: Gravar o número da build no jogo
        run: sed -i 's/^const BUILD := 0/const BUILD := ${{ github.run_number }}/' scripts/ui/build_info.gd

      - name: Importar recursos do projeto
        run: godot --headless --verbose --import || true

      - name: Exportar APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/survive-the-heartland.apk
          ls -lh build/android

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: survive-the-heartland-apk
          path: build/android/survive-the-heartland.apk

      - name: Publicar APK na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: build/android/survive-the-heartland.apk
